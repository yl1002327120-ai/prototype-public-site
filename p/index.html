<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../yangliu-scrm-private-domain-portfolio.html">
  <link rel="canonical" href="../yangliu-scrm-private-domain-portfolio.html">
  <title>杨柳｜产品作品集</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: #111827;
      background:
        radial-gradient(circle at 18% 10%, rgba(31, 107, 255, 0.18), transparent 30%),
        linear-gradient(180deg, #fbfdff 0%, #eef3fb 100%);
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
    }
    .card {
      width: min(520px, calc(100vw - 40px));
      padding: 34px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid #dfe8f6;
      border-radius: 26px;
      box-shadow: 0 22px 60px rgba(20, 45, 90, 0.12);
      text-align: center;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 54px;
      height: 54px;
      margin: 0 auto 18px;
      color: #fff;
      background: linear-gradient(135deg, #1f6bff, #17b8c9);
      border-radius: 18px;
      font-size: 24px;
      font-weight: 900;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0 0 22px;
      color: #667085;
      line-height: 1.8;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      padding: 0 18px;
      color: #fff;
      background: #1f6bff;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
  <script>
    window.location.replace("../yangliu-scrm-private-domain-portfolio.html");
  </script>
</head>
<body>
  <main class="card">
    <div class="mark">杨</div>
    <h1>正在打开产品作品集</h1>
    <p>如果页面没有自动跳转，请点击下方按钮查看 SCRM 私域客户运营闭环作品。</p>
    <a href="../yangliu-scrm-private-domain-portfolio.html">打开作品集</a>
  </main>
</body>
</html>
